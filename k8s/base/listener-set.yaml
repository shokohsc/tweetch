---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: tweetch
  annotations:
    cert-manager.io/cluster-issuer: ca-cluster-issuer
spec:
  parentRef:
    name: default
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
  - name: tweetch
    hostname: tweetch.cluster.local
    protocol: HTTP
    port: 80
