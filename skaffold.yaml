apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: tweetch
build:
  artifacts:
    - image: shokohsc/tweetch
      context: .
      sync:
        infer:
          - src/**/*.js
          - src/**/*.vue
      docker:
        dockerfile: Dockerfile.dev
        buildArgs:
          VITE_TWITCH_CLIENT_ID: 9f05rnp1cbk59gk0xdhsew7xe8p3ds4
          VITE_TWITCH_CLIENT_SECRET: dr59o45ttbn87e4580r3ttf0wg1a2t
manifests:
  kustomize:
    paths:
      - k8s/base
deploy:
  kubectl: {}
profiles:
  - name: dev
    activation:
      - command: dev
    build:
      artifacts:
        - image: shokohsc/tweetch
          sync:
            infer:
              - src/**/*.js
              - src/**/*.vue
  - name: shokohsc
    build:
      artifacts:
        - image: shokohsc/tweetch
          sync:
            infer:
              - src/**/*.js
              - src/**/*.vue
          kaniko:
            cache:
              repo: shokohsc/tweetch
            dockerfile: Dockerfile.dev
            useNewRun: true
            buildArgs:
              VITE_TWITCH_CLIENT_ID: 9f05rnp1cbk59gk0xdhsew7xe8p3ds4
              VITE_TWITCH_CLIENT_SECRET: dr59o45ttbn87e4580r3ttf0wg1a2t
      cluster:
        dockerConfig:
          secretName: kaniko-secret
        namespace: kaniko
        pullSecretName: kaniko-secret
        labels:
          policy.gatekeeper.sh/ignore-psp-pods-allowed-user-ranges: "true"
          policy.gatekeeper.sh/ignore-psp-readonlyrootfilesystem: "true"
          policy.gatekeeper.sh/ignore-psp-allow-privilege-escalation-container: "true"
          policy.gatekeeper.sh/ignore-psp-seccomp-baseline: "true"
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 1Gi
    manifests:
      kustomize:
        paths:
          - k8s/overlays/shokohsc
    deploy:
      kubectl: {}
  - name: prod
    build:
      artifacts:
        - image: shokohsc/tweetch
          kaniko:
            cache:
              repo: shokohsc/tweetch
            dockerfile: Dockerfile
            useNewRun: true
            buildArgs:
              VITE_TWITCH_CLIENT_ID: 9f05rnp1cbk59gk0xdhsew7xe8p3ds4
              VITE_TWITCH_CLIENT_SECRET: dr59o45ttbn87e4580r3ttf0wg1a2t
      cluster:
        dockerConfig:
          secretName: kaniko-secret
        namespace: kaniko
        pullSecretName: kaniko-secret
        labels:
          policy.gatekeeper.sh/ignore-psp-pods-allowed-user-ranges: "true"
          policy.gatekeeper.sh/ignore-psp-readonlyrootfilesystem: "true"
          policy.gatekeeper.sh/ignore-psp-allow-privilege-escalation-container: "true"
          policy.gatekeeper.sh/ignore-psp-seccomp-baseline: "true"
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 1Gi
